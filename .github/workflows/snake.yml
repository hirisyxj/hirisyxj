name: Generate Chocobo Trail

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23c8860a&color_dots=%23f5deb3,%23d4a855,%23c8860a,%23a0522d,%237b3f00
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23f0a500&color_dots=%232a1a0a,%237b3f00,%23a0522d,%23c8860a,%23f0a500

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
